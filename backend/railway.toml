[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'python manage.py collectstatic --noinput && python manage.py migrate && celery -A config worker --loglevel=info --concurrency=1 & gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120'"
restartPolicyType = "on_failure"
